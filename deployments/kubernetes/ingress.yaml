apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: profibus-ingress
  namespace: profibus
  labels:
    app: profibus
  annotations:
    # Nginx specific annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"

    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # TLS/SSL
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # If using cert-manager

    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"

    # WebSocket support
    nginx.ingress.kubernetes.io/websocket-services: "profibus-service"

    # Body size limit
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - profibus.yourdomain.com
    - api.profibus.yourdomain.com
    secretName: profibus-tls-secret
  rules:
  # Main application
  - host: profibus.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: profibus-service
            port:
              number: 80
  # API subdomain
  - host: api.profibus.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: profibus-service
            port:
              number: 80
---
# TLS Secret (if not using cert-manager)
# apiVersion: v1
# kind: Secret
# metadata:
#   name: profibus-tls-secret
#   namespace: profibus
# type: kubernetes.io/tls
# data:
#   tls.crt: <base64-encoded-cert>
#   tls.key: <base64-encoded-key>
