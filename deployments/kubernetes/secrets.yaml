apiVersion: v1
kind: Secret
metadata:
  name: profibus-secrets
  namespace: profibus
  labels:
    app: profibus
type: Opaque
data:
  # Base64 encoded secrets
  # To encode: echo -n 'your-value' | base64
  # To decode: echo 'encoded-value' | base64 -d

  # Database credentials
  DB_USER: cHJvZmlid3M=  # profibus
  DB_PASSWORD: cHJvZmlid3NfcGFzc3dvcmQ=  # profibus_password (CHANGE THIS!)

  # Redis password
  REDIS_PASSWORD: cmVkaXNfcGFzc3dvcmQ=  # redis_password (CHANGE THIS!)

  # JWT Secret (minimum 32 characters)
  JWT_SECRET: eW91ci1zdXBlci1zZWNyZXQtand0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi1taW4tMzItY2hhcnM=
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: profibus
  labels:
    app: postgres
type: Opaque
data:
  POSTGRES_USER: cHJvZmlid3M=  # profibus
  POSTGRES_PASSWORD: cHJvZmlid3NfcGFzc3dvcmQ=  # profibus_password (CHANGE THIS!)
  POSTGRES_DB: cHJvZmlid3M=  # profibus
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: profibus
  labels:
    app: redis
type: Opaque
data:
  REDIS_PASSWORD: cmVkaXNfcGFzc3dvcmQ=  # redis_password (CHANGE THIS!)
